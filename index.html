<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="상하이 여행" />
<meta name="description" content="상하이 4박 5일 여행 일정표 — 카드를 누르면 상단 지도가 그 위치로 이동합니다." />
<title>상하이 4박 5일</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
/>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
/>
<link
  rel="preload"
  as="font"
  type="font/woff2"
  href="./webfonts/OnglipParkDahyun.woff2?v=12"
  crossorigin
/>
<link
  rel="preload"
  as="font"
  type="font/woff2"
  href="./webfonts/Cafe24Ssurround.woff2?v=12"
  crossorigin
/>
<link rel="stylesheet" href="./styles.css?v=12" />
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>상하이 4박 5일 🇨🇳</h1>
    <p>8월 14일 – 18일 · 上海 · 카드를 누르면 위 지도가 그 위치로 이동해요</p>
  </header>

  <nav class="day-tabs" id="dayTabs" aria-label="여행 일자"></nav>

  <section class="map-panel" id="mapPanel" aria-label="오늘 동선 지도">
    <div class="leg-info" id="legInfo" hidden></div>
    <div id="map"></div>
    <button class="map-toggle" id="mapToggle" type="button">지도 접기 ▲</button>
  </section>

  <main id="app"></main>

  <footer>
    개인 여행용 일정표 · 지도 타일 © OpenStreetMap, © CARTO
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./data.js?v=12"></script>
<script src="./app.js?v=12"></script>
</body>
</html>
